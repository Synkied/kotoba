# Whisper on an NVIDIA GPU (needs the NVIDIA Container Toolkit): make up GPU=1
services:
  kotoba:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  voicevox:
    image: ${VOICEVOX_IMAGE:-voicevox/voicevox_engine:nvidia-latest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
