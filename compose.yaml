# docker compose up -d  →  http://localhost:8780     (or: make up)
# Settings: cp .env.example .env, then edit it. Compose reads it for the values below too.
# Profiles:  voicevox  the VOICEVOX engine, for more Japanese voices (VOICEVOX=1 with make)
# compose.gpu.yaml runs Whisper on an NVIDIA GPU (GPU=1 with make).
services:
  kotoba:
    build:
      context: .
      args:
        GPU: ${GPU:-0}
    image: kotoba
    restart: unless-stopped
    ports:
      # localhost only: reach it from a phone with `tailscale serve`, or put an HTTPS proxy in front
      # on a server (KOTOBA_HTTPS=1). Everyone signs in; see KOTOBA_SIGNUP in .env.example.
      - "127.0.0.1:${KOTOBA_PORT:-8780}:8780"
    volumes:
      - kotoba-data:/data
    # Settings go in a .env file next to this one (cp .env.example .env): all of it reaches kotoba.
    env_file:
      - path: .env
        required: false
    environment:
      # Docker's own defaults; a value in .env wins
      KOTOBA_VOICEVOX: ${KOTOBA_VOICEVOX:-http://voicevox:50021}
      # translations: Ollama or llama-server on the host (more choices on the Add-ons page)
      KOTOBA_LLM_URL: ${KOTOBA_LLM_URL:-http://host.docker.internal:11434/v1}
      TZ: ${TZ:-UTC}
      KOTOBA_DATA: /data  # the volume, whatever .env says for local runs
      KOTOBA_POT_URL: http://pot:4416
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Heard on YouTube: the proof-of-origin tokens YouTube wants before it hands over subtitles.
  # Reached by kotoba only; it isn't published on this machine (it has no access control).
  # Keep the tag at the version of bgutil-ytdlp-pot-provider in backend/pyproject.toml.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    init: true

  voicevox:
    profiles: [voicevox]
    image: ${VOICEVOX_IMAGE:-voicevox/voicevox_engine:cpu-latest}
    restart: unless-stopped

volumes:
  kotoba-data:
